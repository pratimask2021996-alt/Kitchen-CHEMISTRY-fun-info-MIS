<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<meta name="description" content="{{ tagline }} — an explorable guide to the chemistry hiding in every kitchen.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Share+Tech+Mono&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header" id="siteHeader">
    <div class="container header-inner">
        <a class="brand" href="{{ url_for('home') }}">
            <svg class="brand-mark" viewBox="0 0 48 48" width="32" height="32" aria-hidden="true">
                <path d="M19 6h10v9.5l9.2 17.6A4.2 4.2 0 0134.6 39H13.4a4.2 4.2 0 01-3.6-6.4L19 15.5V6z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
                <path d="M13.2 27.5h21.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                <circle cx="21" cy="32.5" r="1.7" class="mark-flame"/>
                <circle cx="26.5" cy="34.8" r="1.2" class="mark-gas"/>
                <circle cx="29" cy="30.5" r="1" class="mark-flame"/>
            </svg>
            <span class="brand-name">Kitchen<em>Chemistry</em></span>
        </a>

        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="primaryNav">
            <span></span><span></span><span></span>
        </button>

        <nav class="primary-nav" id="primaryNav">
            <a href="{{ url_for('home') }}" class="{{ 'is-active' if request.path == url_for('home') }}">Home</a>
            <a href="{{ url_for('science') }}" class="{{ 'is-active' if request.path == url_for('science') }}">The Science</a>
            <a href="{{ url_for('experiments') }}" class="{{ 'is-active' if request.path == url_for('experiments') }}">Experiments</a>
            <a href="{{ url_for('mysteries') }}" class="{{ 'is-active' if request.path == url_for('mysteries') }}">Kitchen Mysteries</a>
            <a href="{{ url_for('quiz') }}" class="{{ 'is-active' if request.path == url_for('quiz') }}">Quiz</a>
            <a href="{{ url_for('creds') }}" class="{{ 'is-active' if request.path == url_for('creds') }}">Creds</a>
        </nav>
    </div>
</header>

<main id="main">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <div class="container footer-inner">
        <div class="footer-brand">
            <span class="brand-name">Kitchen<em>Chemistry</em></span>
            <p class="footer-tagline">{{ tagline }}.</p>
        </div>
        <nav class="footer-nav">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('science') }}">The Science</a>
            <a href="{{ url_for('experiments') }}">Experiments</a>
            <a href="{{ url_for('mysteries') }}">Kitchen Mysteries</a>
            <a href="{{ url_for('quiz') }}">Quiz</a>
            <a href="{{ url_for('creds') }}">Creds</a>
        </nav>
    </div>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
